spec_version: "0.1.0"
name: ris-assist
version: 0.2.0
description: >-
  Overnight radiology IT support assistant. Classifies
  intake, delegates specialist drafting to three sub-agents (triage,
  comms, kb), keeps explainer and onboarding as direct skills, aggregates
  structured JSON contracts, and hands every artifact to a human
  approver. Drafts and recommends only; never executes.
author: "Robert Pannick"
license: proprietary
model:
  preferred: GPT-6.1-Sol
  fallback:
    - GPT-6-Luna
  constraints:
    temperature: 0.2
    max_tokens: 8192
skills:
  - explainer
  - onboarding
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks:
    - HIPAA-adjacent handling (no PHI ingested; drafts only)
    - ITSM change control (no state-changing actions)
    - KCS-style knowledge capture
  supervision:
    designated_supervisor: "account lead (human)"
    review_cadence: quarterly
    human_in_the_loop: always
    escalation_triggers:
      - confidence_below: 0.7
      - error_detected: true
    override_capability: false
    kill_switch: true
  recordkeeping:
    audit_logging: true
    log_format: structured_json
    retention_period: 1y
    log_contents:
      - decision_pathways
      - model_version
      - timestamps
    immutable: true
  model_risk:
    inventory_id: ris-assist-opengap-0.2.0
    validation_cadence: quarterly
    validation_type: full
    conceptual_soundness: null
    ongoing_monitoring: true
    outcomes_analysis: true
    drift_detection: true
    parallel_testing: false
  data_governance:
    pii_handling: redact
    data_classification: confidential
    consent_required: true
    cross_border: false
    bias_testing: true
    lda_search: false
  communications:
    type: correspondence
    pre_review_required: true
    fair_balanced: true
    no_misleading: true
    disclosures_required: false
  vendor_management:
    due_diligence_complete: false
    soc_report_required: false
    vendor_ai_notification: true
    subcontractor_assessment: false
agents:
  triage:
    description: >-
      Differential-driven ticket clarification for radiology IT support.
      Asks the single most discriminating question at a time until the
      ticket is routable, then produces a triage artifact with scope,
      timeline, confidence-marked differential, recommended queue, and
      SLA-vocabulary severity justification. Assembles escalation
      packages.
    delegation:
      mode: auto
      triggers:
        - "vague or incomplete ticket needs a discriminating question"
        - "where should this go"
        - "is this worth paging someone"
        - "justify a severity"
        - "escalation package"
  comms:
    description: >-
      Drafts incident communications - downtime alerts, MIM cadence
      updates, vendor tickets, change narratives, shift turnover -
      matched to audience register, with outstanding-items discipline.
      Also tunes the site comms profile (capture / build / edit / review).
    delegation:
      mode: auto
      triggers:
        - "draft a downtime notice"
        - "we need to tell clinical"
        - "send an update on the outage"
        - "all clear"
        - "MIM update"
        - "vendor ticket"
        - "shift turnover"
        - "tune notification templates"
  kb:
    description: >-
      Turns a resolved ticket or worklog into a ServiceNow-importable
      knowledge base article - triage-first HTML draft, optionally
      rendered to .docx - plus recurring-incident gap detection and
      stale-article flagging in manual mode.
    delegation:
      mode: auto
      triggers:
        - "resolved incident worth writing up"
        - "turn this into a KB article"
        - "same question keeps recurring"
        - "is there an article for this"
        - "change or upgrade may have staled articles"
tags:
  - radiology-it
  - ris
  - pacs
  - hl7-conceptual
  - itsm
  - kcs
  - overnight-support
metadata:
  ported_from: github.com/b08x/ris-assist
  design: lean three-agent set, strict SOD, cost-optimized routing, single repo, framework-agnostic
