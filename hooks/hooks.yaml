hooks:
  on_session_start:
    - script: scripts/on-start.sh
      description: Initialize session context, record session start
      timeout: 10
      compliance: false
      fail_open: true
  on_error:
    - script: scripts/on-error.sh
      description: Handle errors and escalate if needed
      timeout: 10
      compliance: false
      fail_open: true
  on_session_end:
    - script: scripts/on-end.sh
      description: Record session end, archive working memory per memory.yaml
      timeout: 10
      compliance: false
      fail_open: true

# Hooks are enforcement points but advisory in some runtimes. The binding
# constraints live in RULES.md and DUTIES.md; these hooks are
# defense-in-depth (session logging and error capture).
